    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F8FC" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230968D9'/%3E%3Ctext x='32' y='39' text-anchor='middle' font-family='Arial,sans-serif' font-size='24' font-weight='700' fill='white'%3ESG%3C/text%3E%3C/svg%3E" />
    <meta name="description" content="Sandip Ghosh builds YouTube growth systems through audience research, content strategy, packaging, programming and creative operations." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sandip Ghosh — YouTube Growth & Content Strategy" />
    <meta property="og:description" content="Proof-of-work across YouTube growth, content strategy and creative operations." />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('sandip-theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.content = theme === 'dark' ? '#0F1B2B' : '#F5F8FC';
        } catch (_) {}
      })();
    </script>
    <title>Sandip Ghosh — YouTube Growth & Content Strategy</title>
  </head>
